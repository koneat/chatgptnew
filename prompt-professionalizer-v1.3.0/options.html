<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Professionalizer 设置</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b1120;color:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1120,#111827 55%,#172554);min-height:100vh}.layout{width:min(1060px,calc(100% - 32px));margin:auto;padding:32px 0 60px}header,.section-head,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{margin:0 0 8px}h2{margin:0 0 6px;font-size:18px}p{margin:0;color:#94a3b8;line-height:1.55}.notice{margin-top:12px;padding:10px 12px;border:1px solid #334155;border-radius:10px;background:#111827;color:#cbd5e1}.card{margin:16px 0;padding:20px;border:1px solid #263449;border-radius:16px;background:rgba(15,23,42,.9)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.span-two{grid-column:span 2}label{display:flex;flex-direction:column;gap:7px;color:#cbd5e1;font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #334155;border-radius:10px;padding:10px 11px;background:#020617;color:#e2e8f0;font:13px/1.4 inherit}textarea{resize:vertical}button{border:1px solid #475569;border-radius:9px;padding:9px 12px;background:#1e293b;color:#fff;cursor:pointer;font-weight:700}button.primary{background:#4f46e5;border-color:#4f46e5}.secret{display:grid;grid-template-columns:1fr auto;gap:8px}.checkbox{flex-direction:row;align-items:center;padding-top:24px}.checkbox input{width:auto}.status{font-size:13px;color:#86efac}.toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;border-radius:10px;background:#14532d;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1}.toast.error{background:#7f1d1d}@media(max-width:800px){.grid{grid-template-columns:1fr}.span-two{grid-column:auto}header,.section-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="layout"><header><div><h1>Prompt Professionalizer v1.3.0</h1><p>OpenRouter 单请求严格保真专业化改写。</p><div class="notice">安全类内容默认采用用户已确认的本地靶场、隔离实验环境或授权红队背景。仅保留一个模式，无人格系统。默认 Temperature 0.3，最大输出 1024 Token。</div></div><button id="save" class="primary">保存全部设置</button></header>
<section class="card"><div class="section-head"><div><h2>模型接口</h2><p>默认 OpenRouter Free，也支持其他 OpenAI Chat Completions 兼容接口。</p></div><div class="actions"><button id="add-provider">新增接口</button><button id="delete-provider">删除当前接口</button></div></div><label>当前接口<select id="provider-select"></select></label><div class="grid"><label>配置名称<input id="provider-name"></label><label>模型名称<input id="provider-model" list="models"><datalist id="models"></datalist></label><label>Base URL<input id="provider-base-url"></label><label>接口路径<input id="provider-path"></label><label class="span-two">API Key<div class="secret"><input id="provider-api-key" type="password" autocomplete="off"><button id="toggle-key">显示</button></div></label><label>Temperature<input id="provider-temperature" type="number" min="0" max="2" step="0.1"></label><label>超时（毫秒）<input id="provider-timeout" type="number" min="1000" max="180000" step="1000"></label><label>最大输入字符数<input id="provider-max-input" type="number" min="100" max="100000"></label><label>最大输出 Token<input id="provider-max-output" type="number" min="32" max="16384"></label><label class="checkbox"><input id="provider-fast" type="checkbox">快速模式（512/768/配置上限）</label><label>附加请求头 JSON<input id="provider-headers"></label></div><div class="actions" style="margin-top:14px;justify-content:flex-start"><button id="fetch-models">拉取模型列表</button><button id="test-provider">验证接口</button><span id="provider-status" class="status"></span></div></section>
<section class="card"><div class="section-head"><div><h2>唯一改写规则</h2><p>固定为严格保真专业化。可以编辑规则，但不能新增第二个模式。</p></div><button id="reset-prompt">恢复默认规则</button></div><label>系统改写规则<textarea id="global-prompt" rows="13"></textarea></label></section><div id="toast" class="toast"></div></main><script src="options.js"></script></body></html>
